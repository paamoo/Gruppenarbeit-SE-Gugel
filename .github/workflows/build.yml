name: Build & Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: container-registry.gugel.dev
  IMAGE: container-registry.gugel.dev/group8/math-formulas

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Baut die App und führt die Tests aus (bei PRs und auf main)
      - name: Maven build & test
        run: mvn -B package

      - name: Build image
        run: docker build -f src/main/docker/Dockerfile.jvm -t $IMAGE:${GITHUB_SHA::7} -t $IMAGE:latest .

      # Gepusht wird nur nach dem Merge auf main, nicht bei PRs
      - name: Login registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker push $IMAGE:${GITHUB_SHA::7}
          docker push $IMAGE:latest
